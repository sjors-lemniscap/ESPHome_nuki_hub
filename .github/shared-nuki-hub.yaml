esphome:
  name: test-nuki-hub
  on_boot:
    - if:
        condition:
          nuki_hub.paired: opener
        then:
          - logger.log: "YAML: already paired with the Opener"

esp32:
  variant: esp32

wifi:
  ssid: "test"
  password: "test1234"

api:
  reboot_timeout: 0s

logger:
  level: DEBUG

time:
  - platform: sntp
    id: sntp_time

mqtt:
  broker: 192.168.1.10
  discovery: false
  # A publish must not hold up the main loop when the connection to the broker stalls
  idf_send_async: true
  # ESPHome would publish its whole debug log on <topic_prefix>/debug otherwise
  log_topic: null

external_components:
  - source:
      type: local
      path: "../components/"

esp32_ble_tracker:

nuki_hub:
  - id: opener
    type: opener
    topic_prefix: door
    security_pin: 1234
    time_id: sntp_time
    update_time: true
    pairing_mode_at_boot: true
    mqtt_log: INFO
  - id: smartlock
    type: lock
    topic_prefix: room
    security_pin: 1234
    keypad_publish_code: true
    pairing:
      ble_address: "54:D2:72:00:00:01"
      secret_key: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      authorization_id: "01020304"
    hybrid_mode:
      send_actions: true
      fallback_timeout: 3s
    door_sensor_input: reed_switch
    debug:
      communication: true

lock:
  - platform: nuki_hub
    nuki_hub_id: opener
    name: Opener
  - platform: nuki_hub
    nuki_hub_id: smartlock
    name: Smart Lock

button:
  - platform: template
    name: Open
    on_press:
      - nuki_hub.action:
          id: opener
          action: electricStrikeActuation
  - platform: template
    name: Pair
    on_press:
      - nuki_hub.set_pairing_mode:
          id: opener
          pairing_mode: true
  - platform: template
    name: Unpair
    on_press:
      - nuki_hub.unpair: smartlock
  - platform: nuki_hub
    nuki_hub_id: smartlock
    unpair:
      name: "Lock unpair"
    request_calibration:
      name: "Lock request_calibration"
    reboot:
      name: "Lock reboot"
    query_state:
      name: "Lock query_state"
    query_config:
      name: "Lock query_config"
    query_battery:
      name: "Lock query_battery"
    query_keypad:
      name: "Lock query_keypad"

switch:
  - platform: nuki_hub
    nuki_hub_id: smartlock
    pairing_mode:
      name: "Lock pairing_mode"
    bluetooth_pairing_enabled:
      name: "Lock bluetooth_pairing_enabled"
    auto_unlatch:
      name: "Lock auto_unlatch"
    led_enabled:
      name: "Lock led_enabled"
    night_mode_enabled:
      name: "Lock night_mode_enabled"
    night_mode_auto_lock_enabled:
      name: "Lock night_mode_auto_lock_enabled"
    night_mode_auto_unlock_disabled:
      name: "Lock night_mode_auto_unlock_disabled"
    night_mode_immediate_lock_on_start_enabled:
      name: "Lock night_mode_immediate_lock_on_start_enabled"
    auto_lock_enabled:
      name: "Lock auto_lock_enabled"
    auto_unlock_disabled:
      name: "Lock auto_unlock_disabled"
    immediate_auto_lock_enabled:
      name: "Lock immediate_auto_lock_enabled"
    auto_update_enabled:
      name: "Lock auto_update_enabled"
    single_lock_enabled:
      name: "Lock single_lock_enabled"
    dst_mode_enabled:
      name: "Lock dst_mode_enabled"
    auto_battery_type_detection_enabled:
      name: "Lock auto_battery_type_detection_enabled"
    slow_speed_during_night_mode_enabled:
      name: "Lock slow_speed_during_night_mode_enabled"
    detached_cylinder_enabled:
      name: "Lock detached_cylinder_enabled"
    button_enabled:
      name: "Lock button_enabled"
  - platform: nuki_hub
    nuki_hub_id: opener
    pairing_mode:
      name: "Opener pairing_mode"
    button_enabled:
      name: "Opener button_enabled"
    disable_rto_after_ring:
      name: "Opener disable_rto_after_ring"
    led_flash_enabled:
      name: "Opener led_flash_enabled"
    random_electric_strike_delay:
      name: "Opener random_electric_strike_delay"
    sound_confirmation:
      name: "Opener sound_confirmation"

number:
  - platform: nuki_hub
    nuki_hub_id: smartlock
    led_brightness:
      name: "Lock led_brightness"
    timezone_offset:
      name: "Lock timezone_offset"
    lock_n_go_timeout:
      name: "Lock lock_n_go_timeout"
    auto_lock_timeout:
