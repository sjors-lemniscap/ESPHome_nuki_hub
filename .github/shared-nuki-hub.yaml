select:
  - platform: nuki_hub
    nuki_hub_id: smartlock
    advertising_mode:
      name: "Lock advertising_mode"
    battery_type:
      name: "Lock battery_type"
    double_buton_press_action:
      name: "Lock double_buton_press_action"
    fob_action_1:
      name: "Lock fob_action_1"
    fob_action_2:
      name: "Lock fob_action_2"
    fob_action_3:
      name: "Lock fob_action_3"
    motor_speed:
      name: "Lock motor_speed"
    single_buton_press_action:
      name: "Lock single_buton_press_action"
    timezone:
      name: "Lock timezone"
  - platform: nuki_hub
    nuki_hub_id: opener
    doorbell_suppression:
      name: "Opener doorbell_suppression"
    double_button_press_action:
      name: "Opener double_button_press_action"
    fob_action_1:
      name: "Opener fob_action_1"
    fob_action_2:
      name: "Opener fob_action_2"
    fob_action_3:
      name: "Opener fob_action_3"
    single_button_press_action:
      name: "Opener single_button_press_action"
    sound_cm:
