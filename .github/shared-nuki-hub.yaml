binary_sensor:
  - platform: template
    id: reed_switch
    name: Door contact
  - platform: nuki_hub
    nuki_hub_id: smartlock
    paired:
      name: Lock paired
    available:
      name: Lock connected
    topics:
      - name: Lock battery charging
        topic: /battery/basicJson
        key: charging
      - name: Lock door open
        topic: /doorSensorState
        payload_on: doorOpened

sensor:
  - platform: nuki_hub
    nuki_hub_id: smartlock
    topics:
      - name: Lock battery level
        topic: /battery/basicJson
        key: level

text_sensor:
  - platform: nuki_hub
    nuki_hub_id: smartlock
    topics:
      - name: Lock last action
        topic: /json
        key: last_lock_action
