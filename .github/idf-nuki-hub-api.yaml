# The Opener as a lock entity through the ESPHome API only, without MQTT
esphome:
  name: test-nuki-hub-api

esp32:
  variant: esp32
  framework:
    type: esp-idf

wifi:
  ssid: "test"
  password: "test1234"

api:
  homeassistant_services: true
  custom_services: true
  # Keypad codes from Home Assistant without MQTT: the command goes in through an action,
  # the answer comes back as an event
  actions:
    - action: keypad_command
      variables:
        payload: string
      then:
        - nuki_hub.command:
            id: opener
            topic: /keypad/actionJson
            payload: !lambda "return payload;"

logger:

external_components:
  - source:
      type: local
      path: "../components/"

esp32_ble_tracker:

nuki_hub:
  - id: opener
    type: opener
    topic_prefix: door
    pairing_mode_at_boot: true
    api_transport: true
    on_message:
      - if:
          condition:
            lambda: 'return topic == "/keypad/result" || topic == "/keypad/json" || topic == "/event/keypad";'
          then:
            - homeassistant.event:
                event: esphome.nuki_hub
                data:
                  topic: !lambda "return topic;"
                  payload: !lambda "return payload;"

lock:
  - platform: nuki_hub
    nuki_hub_id: opener
    name: Opener
