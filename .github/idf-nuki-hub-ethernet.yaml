# An Opener on a board with Ethernet (Olimex ESP32-POE) and no Wi-Fi, over the ESPHome API
esphome:
  name: test-nuki-hub-ethernet

esp32:
  board: esp32-poe
  framework:
    type: esp-idf

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

api:
  custom_services: true
  homeassistant_services: true

logger:

external_components:
  - source:
      type: local
      path: "../components/"

esp32_ble_tracker:

nuki_hub:
  - id: opener
    type: opener
    topic_prefix: door
    pairing_mode_at_boot: true
    api_transport: true

lock:
  - platform: nuki_hub
    nuki_hub_id: opener
    name: Opener

sensor:
  - platform: nuki_hub
    nuki_hub_id: opener
    topics:
      - topic: /keypad/count
        name: Keypad codes

text_sensor:
  - platform: nuki_hub
    nuki_hub_id: opener
    topics:
      - topic: /trigger
        name: Trigger

binary_sensor:
  - platform: nuki_hub
    nuki_hub_id: opener
    topics:
      - topic: /continuousMode
        name: Continuous mode
        payload_on: "on"
