name: Build Component

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - file: .github/idf-nuki-hub.yaml
          - file: .github/arduino-nuki-hub.yaml
          - file: .github/idf-nuki-hub-api.yaml
          - file: .github/idf-nuki-hub-ethernet.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Compile Firmware
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: ${{ matrix.config.file }}
          version: ${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}