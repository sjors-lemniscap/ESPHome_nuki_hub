# One room. The pairing values come from tools/nuki_hub_pairing.py, kept in secrets.yaml
# under names of this room.
substitutions:
  room: entrance
  device: opener
  board: esp32-s3-devkitc-1
  timezone: Europe/Berlin
  pin: !secret entrance_nuki_pin
  ble_address: !secret entrance_nuki_ble_address
  secret_key: !secret entrance_nuki_secret_key
  auth_id: !secret entrance_nuki_auth_id

packages:
  room: !include room.yaml
